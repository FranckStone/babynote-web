server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.200.170.181;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 302 https://101.200.170.181$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name babynode.cn www.babynode.cn;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://babynode.cn$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 101.200.170.181;
    server_tokens off;
    client_max_body_size 1m;

    # IP certificates use a separate Certbot instance with short-lived renewal.
    ssl_certificate /etc/letsencrypt-ip/live/babynote-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-ip/live/babynote-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BabyNoteTLS:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $babynote_connection;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
